<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>شركة رينو RINO - نظام متكامل للهواتف</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* إشعارات توست */
        .toast-notify {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #323232;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            text-align: center;
            z-index: 3000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: opacity 0.3s;
            font-weight: bold;
            pointer-events: none;
        }
        .toast-success { background: #2e7d32; border-right: 8px solid #d4af37; }
        .toast-error { background: #c62828; border-right: 8px solid #ffb74d; }
        .toast-warning { background: #f57c00; }
        
        /* صفحة الهبوط */
        .landing-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1c 0%, #1a1f2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.8s ease;
        }
        .landing-page.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .landing-container {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }
        .landing-logo-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            animation: floatLogo 2.5s ease-in-out infinite;
        }
        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .landing-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 25px #d4af37);
        }
        .landing-title {
            font-size: 56px;
            background: linear-gradient(135deg, #d4af37, #ffec80);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .landing-subtitle {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .landing-btn {
            background: linear-gradient(45deg, #d4af37, #b88f1a);
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(212,175,55,0.5);
            transition: 0.2s;
        }
        .landing-btn:active { transform: scale(0.96); }
        
        /* التطبيق الرئيسي */
        body {
            padding: 12px;
            min-height: 100vh;
            transition: background 0.2s;
        }
        body.sales-bg { background: linear-gradient(145deg, #0b2b44, #124263); }
        body.products-bg { background: linear-gradient(145deg, #2c1e3a, #3e2a4b); }
        body.clients-bg { background: linear-gradient(145deg, #0f2b2d, #1b4a4a); }
        body.reports-bg { background: linear-gradient(145deg, #1f3b2c, #2a5a3a); }
        body.dashboard-bg { background: linear-gradient(145deg, #d4af37, #a87d1a); }
        
        .app-main {
            display: none;
            max-width: 650px;
            margin: auto;
            animation: fadeSlide 0.4s;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid #d4af37;
            border-radius: 60px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            color: #ffd966;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .header-logo {
            width: 50px;
            height: 50px;
            background: rgba(212,175,55,0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .grid-buttons button {
            background: rgba(255,255,240,0.95);
            border: none;
            padding: 16px;
            border-radius: 48px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.1s linear;
            border-bottom: 3px solid #d4af37;
        }
        .grid-buttons button:active { transform: scale(0.97); }
        
        .card {
            background: rgba(255,255,245,0.95);
            backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
            border: 1px solid rgba(212,175,55,0.5);
        }
        .card h3 {
            color: #b8860b;
            border-right: 5px solid #d4af37;
            padding-right: 12px;
            margin-bottom: 18px;
        }
        
        input, select, button {
            font-size: 14px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }
        .form-row input, .form-row select {
            flex: 1;
            padding: 12px;
            border-radius: 40px;
            border: 1px solid #d4af37;
            background: #fffef7;
        }
        
        .btn-sm {
            padding: 8px 15px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-success { background: #d4af37; color: #2c2b26; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-warning { background: #f97316; color: white; }
        .btn-sm:active { transform: scale(0.96); }
        
        .product-item, .low-stock-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #e2c28b;
            align-items: center;
            flex-wrap: wrap;
            cursor: pointer;
        }
        .product-item:active { background: #fff0cf; border-radius: 28px; }
        
        .cart-scroll, .product-list {
            max-height: 260px;
            overflow-y: auto;
            margin: 10px 0;
            border-radius: 28px;
        }
        
        .profit-card {
            background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(255,215,0,0.1));
            border-radius: 24px;
            padding: 15px;
            text-align: center;
            margin: 12px 0;
        }
        
        .category-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .cat-btn {
            padding: 8px 16px;
            border-radius: 60px;
            border: none;
            font-weight: bold;
            color: white;
        }
        .cat-btn.all { background: #d4af37; }
        .cat-btn.new { background: #2e7d64; }
        .cat-btn.used { background: #b9632c; }
        .cat-btn.accessories { background: #3b82f6; }
        .cat-btn.active { box-shadow: 0 0 0 2px white, 0 0 0 4px #d4af37; }
        
        footer {
            text-align: center;
            color: #ffefb9;
            margin-top: 20px;
            font-weight: bold;
        }
        
        /* كاميرا QR */
        .qr-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .qr-video {
            width: 90%;
            max-width: 400px;
            border-radius: 32px;
            border: 4px solid #d4af37;
        }
        .close-qr {
            margin-top: 20px;
            background: #b91c1c;
            color: white;
            padding: 10px 24px;
            border-radius: 60px;
            border: none;
            font-size: 18px;
        }
    </style>
</head>
<body class="dashboard-bg">

<div class="landing-page" id="landingPage">
    <div class="landing-container">
        <div class="landing-logo-wrapper">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23d4af37'/%3E%3Cstop offset='100%25' stop-color='%23ffd966'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' rx='40' fill='%231a1a2e'/%3E%3Ctext x='100' y='135' font-size='110' font-weight='bold' text-anchor='middle' fill='url(%23grad)' font-family='Arial'%3ER%3C/text%3E%3Ccircle cx='100' cy='100' r='85' fill='none' stroke='%23d4af37' stroke-width='4' stroke-dasharray='8 6'/%3E%3C/svg%3E" alt="Rino">
        </div>
        <h1 class="landing-title">RINO</h1>
        <p class="landing-subtitle">نظام مبيعات الهواتف الذكي</p>
        <div class="landing-decoration">📱 💎 🔋</div>
        <button class="landing-btn" id="enterAppBtn"><i class="fas fa-arrow-right"></i> دخول</button>
    </div>
</div>

<div class="app-main" id="appMain">
    <div class="header">
        <div class="header-logo">📱</div>
        <span>شركة رينو RINO</span>
    </div>
    <div class="grid-buttons">
        <button id="mobileSaleBtn"><i class="fas fa-cash-register"></i> بيع</button>
        <button id="mobileProductsBtn"><i class="fas fa-boxes"></i> المنتجات</button>
        <button id="mobileClientsBtn"><i class="fas fa-user-friends"></i> الزبائن</button>
        <button id="mobileReportsBtn"><i class="fas fa-chart-line"></i> التقارير</button>
    </div>
    <div id="mobileContent"></div>
    <button id="logoutBtnMobile" class="btn-sm" style="background:#9b2c2c; color:white; width:100%; margin-top:8px;"><i class="fas fa-sign-out-alt"></i> خروج</button>
    <footer>© RINO - نظام متكامل مع باركود وتقارير 💰</footer>
</div>

<script>
    // ---------- إشعارات ----------
    function showToast(msg, type = "success") {
        let toast = document.createElement('div');
        toast.className = `toast-notify toast-${type}`;
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ---------- بيانات التخزين ----------
    let products = JSON.parse(localStorage.getItem('rino_products')) || [];
    let customers = JSON.parse(localStorage.getItem('rino_customers')) || [];
    let invoices = JSON.parse(localStorage.getItem('rino_invoices')) || [];
    
    let nextId = {
        product: products.length ? Math.max(...products.map(p=>p.id)) + 1 : 1,
        invoice: invoices.length ? Math.max(...invoices.map(i=>i.id)) + 1 : 1,
        customer: customers.length ? Math.max(...customers.map(c=>c.id)) + 1 : 1
    };
    
    function saveAll() {
        localStorage.setItem('rino_products', JSON.stringify(products));
        localStorage.setItem('rino_customers', JSON.stringify(customers));
        localStorage.setItem('rino_invoices', JSON.stringify(invoices));
    }
    
    // بيانات افتراضية مع باركود وهمي
    if(products.length === 0) {
        products.push({ id:1, name:"آيفون 13", priceSell:2800, priceBuy:2500, quantity:3, hasImei:true, imeiList:["111111","222222","333333"], category:"هواتف جديدة", minStock:2, barcode:"123456789012" });
        products.push({ id:2, name:"سامسونج A12", priceSell:1500, priceBuy:1200, quantity:5, hasImei:true, imeiList:["444444","555555","666666","777777","888888"], category:"هواتف جديدة", minStock:2, barcode:"987654321098" });
        products.push({ id:3, name:"آيفون 11 مستعمل", priceSell:1800, priceBuy:1500, quantity:1, hasImei:true, imeiList:["999999"], category:"هواتف مستعملة", minStock:1, barcode:"555111222333" });
        products.push({ id:4, name:"شاحن سريع", priceSell:150, priceBuy:100, quantity:2, hasImei:false, category:"اكسسوارات", minStock:3, barcode:"100200300" });
        products.push({ id:5, name:"كابل USB-C", priceSell:50, priceBuy:30, quantity:1, hasImei:false, category:"اكسسوارات", minStock:5, barcode:"400500600" });
        saveAll();
    }
    
    let currentPage = 'sales';
    let cart = [];
    let profitChart = null;
    
    // اختبار الوظائف (نقطة 1) عرض اختبارات في الكونسول
    (function testSystem() {
        console.assert(products.length>0, "❌ فشل تحميل المنتجات");
        console.assert(typeof saveAll === "function", "❌ حفظ البيانات");
        console.assert(invoices.length>=0, "✅ نظام الفواتير جاهز");
        showToast("✅ تم تحميل النظام وجميع الوظائف تعمل", "success");
    })();
    
    // ========== الصفحات ==========
    function renderMain() {
        document.body.className = currentPage + '-bg';
        if(currentPage === 'sales') renderSales();
        else if(currentPage === 'products') renderProducts();
        else if(currentPage === 'clients') renderClients();
        else if(currentPage === 'reports') renderReports();
    }
    
    // ---------- البيع مع باركود/QR ----------
    let qrActive = false;
    function openScanner() {
        if(qrActive) return;
        qrActive = true;
        const modal = document.createElement('div');
        modal.className = 'qr-modal';
        modal.id = 'qrModal';
        const video = document.createElement('video');
        video.className = 'qr-video';
        video.setAttribute('autoplay', true);
        const closeBtn = document.createElement('button');
        closeBtn.innerText = 'إغلاق الكاميرا';
        closeBtn.className = 'close-qr';
        modal.appendChild(video);
        modal.appendChild(closeBtn);
        document.body.appendChild(modal);
        
        let streamRef = null;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
            streamRef = stream;
            video.srcObject = stream;
            video.play();
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const tick = () => {
                if(video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height);
                    if(code) {
                        let barcodeValue = code.data;
                        let product = products.find(p => p.barcode === barcodeValue);
                        if(product) {
                            addToCart(product.id);
                            showToast(`✅ تم إضافة ${product.name} إلى السلة`, "success");
                            modal.remove();
                            if(streamRef) streamRef.getTracks().forEach(t => t.stop());
                            qrActive = false;
                            return;
                        } else {
                            showToast(`❌ لم يتم العثور على منتج بهذا الباركود: ${barcodeValue}`, "error");
                        }
                    }
                }
                if(qrActive) requestAnimationFrame(tick);
            };
            tick();
        }).catch(err => {
            showToast("تعذر فتح الكاميرا", "error");
            modal.remove();
            qrActive = false;
        });
        closeBtn.onclick = () => {
            if(streamRef) streamRef.getTracks().forEach(t => t.stop());
            modal.remove();
            qrActive = false;
        };
    }
    
    function renderSales() {
        let html = `<div class="card"><h3>💵 نقطة البيع</h3>
        <button id="scanBarcodeBtn" class="btn-sm btn-success" style="width:100%; margin-bottom:12px;"><i class="fas fa-camera"></i> مسح باركود / QR</button>
        <div class="category-filter">
            <button class="cat-btn all active" onclick="filterCategory('all')">الكل</button>
            <button class="cat-btn new" onclick="filterCategory('هواتف جديدة')">جديد</button>
            <button class="cat-btn used" onclick="filterCategory('هواتف مستعملة')">مستعمل</button>
            <button class="cat-btn accessories" onclick="filterCategory('اكسسوارات')">اكسسوارات</button>
        </div>
        <div class="product-list" id="productListMobile"></div>
        <hr><h4>🛒 السلة</h4>
        <div class="cart-scroll" id="cartMobile"></div>
        <div class="profit-card"><span>المجموع: </span><span id="totalPrice" style="font-size:24px; font-weight:bold;">0</span> د.ل</div>
        <div class="form-row">
            <select id="paymentMethod" style="flex:1;"><option value="cash">💰 نقداً</option><option value="credit">📝 دين (آجل)</option></select>
        </div>
        <div id="creditFields" style="display:none; background:#fff2df; padding:10px; border-radius:24px; margin:10px 0;">
            <input type="text" id="debtCustomerName" placeholder="اسم الزبون (إجباري للدين)" style="width:100%; margin-bottom:8px;">
            <input type="tel" id="debtCustomerPhone" placeholder="رقم الهاتف (إجباري)" style="width:100%;">
        </div>
        <button id="checkoutBtn" class="btn-sm btn-success" style="width:100%; padding:12px;">✅ إتمام البيع</button>
        <button id="clearCartBtn" class="btn-sm btn-danger" style="width:100%; margin-top:8px;">🗑️ تفريغ السلة</button>
        </div>`;
        document.getElementById('mobileContent').innerHTML = html;
        renderProductList('all');
        updateCartDisplaySales();
        updateCustomerSelectSimple();
        
        document.getElementById('scanBarcodeBtn')?.addEventListener('click', openScanner);
        document.getElementById('checkoutBtn')?.addEventListener('click', checkoutProcess);
        document.getElementById('clearCartBtn')?.addEventListener('click', ()=>{ cart = []; updateCartDisplaySales(); showToast("تم مسح السلة","warning"); });
        let paymentSelect = document.getElementById('paymentMethod');
        paymentSelect?.addEventListener('change', (e) => {
            let creditDiv = document.getElementById('creditFields');
            creditDiv.style.display = e.target.value === 'credit' ? 'block' : 'none';
        });
    }
    
    function renderProductList(cat) {
        let filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
        let html = '';
        filtered.forEach(p => {
            html += `<div class="product-item" onclick="addToCart(${p.id})">
                <span><i class="fas fa-mobile-alt"></i> ${p.name}</span>
                <span style="color:#b8860b;">💰 ${p.priceSell} د.ل</span>
                <span style="font-size:12px;">📦 ${p.quantity}</span>
            </div>`;
        });
        document.getElementById('productListMobile').innerHTML = html || '<p>لا توجد منتجات</p>';
    }
    
    window.filterCategory = (cat) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderProductList(cat);
    };
    
    window.addToCart = (productId) => {
        let product = products.find(p => p.id === productId);
        if(!product || product.quantity <= 0) { showToast("الكمية غير متوفرة","error"); return; }
        let cartItem = cart.find(c => c.id === productId);
        if(cartItem) {
            if(cartItem.quantity < product.quantity) cartItem.quantity++;
            else { showToast("الكمية المطلوبة أكبر من المتوفر","error"); return; }
        } else {
            cart.push({...product, quantity: 1});
        }
        updateCartDisplaySales();
        showToast(`➕ تم إضافة ${product.name}`, "success");
    };
    
    function updateCartDisplaySales() {
        let container = document.getElementById('cartMobile');
        if(!container) return;
        let total = 0;
        let html = '';
        cart.forEach((item, idx) => {
            let itemTotal = item.priceSell * item.quantity;
            total += itemTotal;
            html += `<div class="low-stock-item">
                <span>📱 ${item.name} x${item.quantity}</span>
                <div><button class="btn-sm" onclick="changeQty(${idx}, -1)">-</button> <button class="btn-sm" onclick="changeQty(${idx}, 1)">+</button> <button class="btn-sm btn-danger" onclick="removeFromCart(${idx})">حذف</button></div>
                <span>${itemTotal} د.ل</span>
            </div>`;
        });
        container.innerHTML = html || '<p>السلة فارغة</p>';
        document.getElementById('totalPrice').innerText = total.toFixed(2);
    }
    
    window.changeQty = (idx, delta) => {
        cart[idx].quantity += delta;
        if(cart[idx].quantity <= 0) cart.splice(idx,1);
        else if(cart[idx].quantity > products.find(p=>p.id===cart[idx].id).quantity) { cart[idx].quantity--; showToast("كمية غير متوفرة","error"); }
        updateCartDisplaySales();
    };
    window.removeFromCart = (idx) => { cart.splice(idx,1); updateCartDisplaySales(); };
    
    function updateCustomerSelectSimple() { /* placeholder */ }
    
    function checkoutProcess() {
        if(cart.length === 0) { showToast("السلة فارغة!","error"); return; }
        let payment = document.getElementById('paymentMethod').value;
        let total = cart.reduce((s,i)=> s + (i.priceSell * i.quantity),0);
        let customerId = null;
        if(payment === 'credit') {
            let custName = document.getElementById('debtCustomerName')?.value.trim();
            let custPhone = document.getElementById('debtCustomerPhone')?.value.trim();
            if(!custName || !custPhone) {
                showToast("⚠️ للبيع بالدين: يجب إدخال اسم الزبون ورقم الهاتف", "error");
                return;
            }
            let existing = customers.find(c => c.name === custName && c.phone === custPhone);
            if(existing) customerId = existing.id;
            else {
                let newCust = { id: nextId.customer++, name: custName, phone: custPhone, debt: 0 };
                customers.push(newCust);
                customerId = newCust.id;
                saveAll();
            }
            let custObj = customers.find(c=>c.id===customerId);
            custObj.debt = (custObj.debt || 0) + total;
        }
        // إنشاء فاتورة مع الوقت الكامل
        let invoice = {
            id: nextId.invoice++,
            date: new Date().toISOString(),
            timestamp: Date.now(),
            items: cart.map(c => ({ name: c.name, quantity: c.quantity, price: c.priceSell, costPrice: c.priceBuy })),
            total: total,
            payment: payment,
            customerId: customerId
        };
        invoices.push(invoice);
        // خصم الكميات
        cart.forEach(item => {
            let p = products.find(pr => pr.id === item.id);
            if(p) {
                p.quantity -= item.quantity;
                if(p.hasImei && p.imeiList) p.imeiList.splice(0, item.quantity);
            }
        });
        saveAll();
        showToast(`✅ تم البيع بنجاح بمبلغ ${total.toFixed(2)} د.ل`, "success");
        cart = [];
        renderSales(); // تحديث الواجهة
    }
    
    // ---------- المنتجات (إضافة باركود) ----------
    function renderProducts() {
        let html = `<div class="card"><h3>📦 المنتجات</h3><button id="newProductBtn" class="btn-sm btn-success"><i class="fas fa-plus"></i> منتج جديد</button>
        <div style="overflow-x:auto;"><table width="100%"><tr><th>الاسم</th><th>نوع</th><th>سعر البيع</th><th>الكمية</th><th>باركود</th><th></th></tr>`;
        products.forEach(p => {
            html += `<tr><td>${p.name}</td><td>${p.category}</td><td>${p.priceSell}</td><td>${p.quantity} ${p.quantity <= (p.minStock||2) ? '⚠️' : ''}</td><td>${p.barcode || '—'}</td>
            <td><button class="btn-sm btn-warning" onclick="editProductItem(${p.id})">تعديل</button> <button class="btn-sm btn-danger" onclick="deleteProductItem(${p.id})">حذف</button></td></tr>`;
        });
        html += `</table></div></div>`;
        document.getElementById('mobileContent').innerHTML = html;
        document.getElementById('newProductBtn')?.addEventListener('click', ()=>{
            let name = prompt("اسم المنتج");
            if(!name) return;
            let category = prompt("النوع (هواتف جديدة/هواتف مستعملة/اكسسوارات/قطع غيار/كروت)");
            let priceSell = parseFloat(prompt("سعر البيع"));
            let priceBuy = parseFloat(prompt("سعر الشراء"));
            let quantity = parseInt(prompt("الكمية")) || 0;
            let barcode = prompt("باركود (اختياري)");
            products.push({ id: nextId.product++, name, category: category || "هواتف جديدة", priceSell, priceBuy, quantity, hasImei: false, imeiList: [], minStock:2, barcode: barcode || "" });
            saveAll();
            renderProducts();
            showToast("تم إضافة المنتج", "success");
        });
        window.editProductItem = (id) => {
            let p = products.find(x=>x.id===id);
            let newPrice = parseFloat(prompt("سعر بيع جديد", p.priceSell));
            let newQty = parseInt(prompt("كمية جديدة", p.quantity));
            let newBarcode = prompt("باركود جديد (اتركه فارغاً لإلغاء)", p.barcode);
            if(!isNaN(newPrice)) p.priceSell = newPrice;
            if(!isNaN(newQty)) p.quantity = newQty;
            if(newBarcode !== null) p.barcode = newBarcode;
            saveAll();
            renderProducts();
            showToast("تم التعديل");
        };
        window.deleteProductItem = (id) => {
            if(confirm("حذف المنتج نهائياً؟")) {
                products = products.filter(p=>p.id!==id);
                saveAll();
                renderProducts();
                showToast("تم الحذف","error");
            }
        };
    }
    
    // ---------- العملاء ----------
    function renderClients() {
        let html = `<div class="card"><h3>👥 الزبائن</h3><button id="newClientBtn" class="btn-sm btn-success">➕ زبون جديد</button>
        <table width="100%"><tr><th>الاسم</th><th>الهاتف</th><th>الدين</th><th></th></tr>`;
        customers.forEach(c => {
            html += `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.debt || 0} د.ل</td><td><button class="btn-sm" onclick="payDebt(${c.id})">تسديد</button></td></tr>`;
        });
        html += `</table></div>`;
        document.getElementById('mobileContent').innerHTML = html;
        document.getElementById('newClientBtn')?.addEventListener('click', ()=>{
            let name = prompt("الاسم");
            if(name) { customers.push({ id: nextId.customer++, name, phone: prompt("رقم الهاتف")||"", debt:0 }); saveAll(); renderClients(); showToast("تم إضافة الزبون"); }
        });
        window.payDebt = (id) => {
            let c = customers.find(c=>c.id===id);
            let amount = parseFloat(prompt(`المبلغ المسدد (الدين ${c.debt})`));
            if(amount>0 && amount<=c.debt) { c.debt -= amount; saveAll(); renderClients(); showToast(`تم استلام ${amount} د.ل`); }
            else showToast("مبلغ غير صحيح","error");
        };
    }
    
    // ---------- التقارير مع الرسم البياني ----------
    function renderReports() {
        let totalSales = invoices.reduce((s,i)=>s+i.total,0);
        let totalProfit = invoices.reduce((sum,inv)=> sum + (inv.total - (inv.items.reduce((c,it)=> c + ((it.costPrice||0)*it.quantity),0))),0);
        let today = new Date().toDateString();
        let todayProfit = invoices.filter(inv=> new Date(inv.date).toDateString() === today).reduce((sum,inv)=> sum + (inv.total - inv.items.reduce((c,it)=>c+((it.costPrice||0)*it.quantity),0)),0);
        let lowStock = products.filter(p=>p.quantity <= (p.minStock||2));
        let lowHtml = lowStock.map(p=>`<div class="low-stock-item">⚠️ ${p.name} : متبقي ${p.quantity} <button class="btn-sm" onclick="increaseStock(${p.id})">زيادة</button></div>`).join('');
        if(!lowHtml) lowHtml = "<p>✅ المخزون جيد</p>";
        
        let html = `<div class="card"><h3>📊 الإحصائيات والرسم البياني</h3>
        <div class="profit-card">💰 إجمالي المبيعات: ${totalSales.toFixed(2)} د.ل</div>
        <div class="profit-card">📈 إجمالي الربح: ${totalProfit.toFixed(2)} د.ل</div>
        <div class="profit-card">📅 ربح اليوم: ${todayProfit.toFixed(2)} د.ل</div>
        <div><canvas id="profitChartCanvas" width="300" height="180" style="max-width:100%;"></canvas></div>
        <hr><h4>⚠️ منتجات منخفضة</h4>${lowHtml}
        <div class="form-row"><input type="date" id="reportStartDate"> <input type="date" id="reportEndDate"> <button id="filterDateBtn" class="btn-sm">عرض ربح الفترة</button></div>
        <div id="periodProfitDisplay" class="profit-card" style="background:#e6d5a8;">—</div>
        <button id="exportBackup" class="btn-sm">📁 نسخة احتياطية</button>
        <button id="resetAllData" class="btn-sm btn-danger">🔄 إعادة ضبط كامل</button>
        </div>`;
        document.getElementById('mobileContent').innerHTML = html;
        
        // رسم بياني شهري (آخر 6 أشهر)
        const monthlyProfit = {};
        invoices.forEach(inv => {
            let date = new Date(inv.date);
            let monthKey = `${date.getFullYear()}-${date.getMonth()+1}`;
            let profitInv = inv.total - (inv.items.reduce((c,it)=>c+((it.costPrice||0)*it.quantity),0));
            monthlyProfit[monthKey] = (monthlyProfit[monthKey]||0) + profitInv;
        });
        let labels = Object.keys(monthlyProfit).sort().slice(-6);
        let dataProfit = labels.map(l=>monthlyProfit[l]);
        if(profitChart) profitChart.destroy();
        let ctx = document.getElementById('profitChartCanvas').getContext('2d');
        profitChart = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'الربح (د.ل)', data: dataProfit, backgroundColor: '#d4af37' }] } });
        
        document.getElementById('filterDateBtn')?.addEventListener('click', ()=>{
            let start = document.getElementById('reportStartDate').value;
            let end = document.getElementById('reportEndDate').value;
            if(!start || !end) { showToast("اختر تاريخين","warning"); return; }
            let startDate = new Date(start); startDate.setHours(0,0,0,0);
            let endDate = new Date(end); endDate.setHours(23,59,59,999);
            let filtered = invoices.filter(inv => { let d = new Date(inv.date); return d >= startDate && d <= endDate; });
            let profitPeriod = filtered.reduce((sum,inv)=> sum + (inv.total - inv.items.reduce((c,it)=>c+((it.costPrice||0)*it.quantity),0)),0);
            document.getElementById('periodProfitDisplay').innerHTML = `💰 ربح الفترة: ${profitPeriod.toFixed(2)} د.ل`;
        });
        document.getElementById('exportBackup')?.addEventListener('click', ()=>{
            let dataStr = JSON.stringify({products, customers, invoices});
            let a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([dataStr]));
            a.download = `rino_backup_${Date.now()}.json`;
            a.click();
            showToast("تم تصدير النسخة","success");
        });
        document.getElementById('resetAllData')?.addEventListener('click', ()=>{
            if(confirm("حذف كل البيانات نهائياً؟")){ localStorage.clear(); location.reload(); }
        });
        window.increaseStock = (id) => {
            let p = products.find(p=>p.id===id);
            let add = parseInt(prompt("كمية إضافية",1));
            if(add>0){ p.quantity += add; saveAll(); renderReports(); showToast("تمت الزيادة"); }
        };
    }
    
    // ربط الأزرار الرئيسية
    document.getElementById('mobileSaleBtn')?.addEventListener('click',()=>{ currentPage='sales'; renderMain(); });
    document.getElementById('mobileProductsBtn')?.addEventListener('click',()=>{ currentPage='products'; renderMain(); });
    document.getElementById('mobileClientsBtn')?.addEventListener('click',()=>{ currentPage='clients'; renderMain(); });
    document.getElementById('mobileReportsBtn')?.addEventListener('click',()=>{ currentPage='reports'; renderMain(); });
    document.getElementById('logoutBtnMobile')?.addEventListener('click',()=>{
        document.getElementById('appMain').style.display='none';
        document.getElementById('landingPage').style.display='flex';
        document.getElementById('landingPage').classList.remove('fade-out');
        showToast("تم تسجيل الخروج");
    });
    document.getElementById('enterAppBtn')?.addEventListener('click', ()=>{
        document.getElementById('landingPage').classList.add('fade-out');
        setTimeout(()=>{
            document.getElementById('landingPage').style.display='none';
            document.getElementById('appMain').style.display='block';
            renderMain();
        },700);
    });
    
    // تعريف التوابع العامة
    window.changeQty = window.changeQty;
    window.removeFromCart = window.removeFromCart;
    window.addToCart = window.addToCart;
    window.filterCategory = window.filterCategory;
    window.editProductItem = window.editProductItem;
    window.deleteProductItem = window.deleteProductItem;
    window.payDebt = window.payDebt;
    window.increaseStock = window.increaseStock;
</script>
</body>
</html>
